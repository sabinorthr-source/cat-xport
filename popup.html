<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PedidosYa Catalog Export</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font: 14px system-ui, sans-serif;
      color: #202124;
    }

    h2 { margin-top: 0; font-size: 18px; }
    p { color: #5f6368; line-height: 1.5; }

    .actions { display: grid; gap: 9px; }

    button {
      padding: 11px;
      border: 0;
      border-radius: 6px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    #extract-backoffice { background: #d9273e; }
    #extract-vendor { background: #2457a7; }

    button:disabled { opacity: .55; cursor: wait; }

    #status {
      min-height: 34px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h2>Catalog Export</h2>

  <p>
    Abre BackOffice o Vendor en la pestaña actual y selecciona
    el tipo de extracción. Vendor recorre la paginación visible de forma secuencial.
  </p>

  <div class="actions">
    <button id="extract-backoffice">Extraer BackOffice</button>
    <button id="extract-vendor">Extraer Vendor</button>
  </div>

  <p id="status" role="status" aria-live="polite">
    Listo para comenzar.
  </p>

  <script src="popup.js"></script>
</body>
</html>
